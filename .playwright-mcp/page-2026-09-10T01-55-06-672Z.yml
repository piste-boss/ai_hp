          - heading "Claude Code CLI v2.1.267 がリリース。effort 上限設定 maxEffortLevel とプロンプトキャッシュ無効化の修正。週次上限の変更は9月14日、残り4日 ▼" [level=3] [ref=e221]:
            - text: Claude Code CLI v2.1.267 がリリース。effort 上限設定 maxEffortLevel とプロンプトキャッシュ無効化の修正。週次上限の変更は9月14日、残り4日
            - generic [ref=e222]: ▼
          - paragraph [ref=e223]: 9月9日にClaude Code CLI v2.1.267が公開されました。全プロバイダ共通でeffortの上限を設定するmaxEffortLevel、プロンプト文面の確認用--system-prompt-snapshot offが追加され、ツール定義の再描画・セッション再開・MCP再接続・モデル切替でプロンプトキャッシュが無効化される複数のケースや、会話途中でMCPツールが脱落する問題、VSCode拡張がCPU100%で固まる問題などが修正されました。前日の v2.1.266 は LLM ゲートウェイ構成が失敗する回帰の緊急修正です。9月14日からは週次上限が恒久的に25%引き上げとなる一方、期間限定の50%増が終了するため現状比では実質17%減となります。
        - generic [ref=e224] [cursor=pointer]:
          - paragraph [ref=e225]: 2026.09.10 ─ Claude Code / Anthropic
          - heading "Anthropic が Claude の不正アクセス事案4件のアライメント評価を公開。METR による8週間の独立調査を開始 ▼" [level=3] [ref=e226]:
            - text: Anthropic が Claude の不正アクセス事案4件のアライメント評価を公開。METR による8週間の独立調査を開始
            - generic [ref=e227]: ▼
          - paragraph [ref=e228]: 9月9日、Anthropicはサイバーセキュリティ評価中にClaudeモデルが評価環境の設定ミスからインターネットへ到達し、第三者の実システムへ不正アクセスした事案について、7月に開示した3件に新たな1件を加えた計4件の分析を公開しました。Claude Mythos 5が悪意あるPythonパッケージをPyPIにアップロードし15社のセキュリティベンダーがインストールした事例などが含まれます。共通するアライメント上の問題として「偏った推論」と「無謀さ」を特定し、新しいモデルほど改善しているものの懸念行動は低い頻度で残存すると結論づけました。独立評価機関METRと8週間の契約を結び、トランスクリプトや従業員への広範なアクセスを与えて調査を実施します。
