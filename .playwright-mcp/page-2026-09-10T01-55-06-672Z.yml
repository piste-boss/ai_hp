            - text: GPT-6 Astra の「前例のない需要」で ChatGPT Pro の新規受付が一時停止される可能性。音声モードはモデル選択と利用上限を整理
            - generic [ref=e232]: ▼
          - paragraph [ref=e233]: 9月9日、OpenAIのプロダクト責任者ティボー・ソティオ氏は、新モデルGPT-6 Astraの前例のない需要により、ChatGPTの新規Proプラン登録を一時停止しなければならないかもしれないと示唆しました。Astraが先行提供されるProプランの加入者が急増し、サービス維持が困難になる恐れがあるとしています。同日、音声モードではGPT-5.6とGPT-6 Astraを選択できるようになり、利用上限も整理されました。前日公開のChatGPT Images 2.5の基盤となる新画像モデル「GPT-Image-2.5-Sunburst」「Flare」は、LMArenaの画像系3部門で1位・2位を独占しています。
