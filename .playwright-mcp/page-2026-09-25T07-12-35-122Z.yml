        - text: 筆者のAIコンサルティングでは、従業員10名規模の企業で経理業務の自動化を支援。月間の経理作業時間を
        - strong [ref=e110]: 40時間 → 8時間
        - text: に削減した実績があります。
    - heading "3. 経理のAI自動化はどう始めて、どのツールを使えばいいですか？" [level=2] [ref=e111]
