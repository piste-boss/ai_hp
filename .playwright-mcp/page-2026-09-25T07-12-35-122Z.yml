        - text: ": 経理担当者一人に業務が集中し、休職・退職時にリスクが生じる"
    - heading "AIで解決できること" [level=3] [ref=e67]
    - paragraph [ref=e68]: 生成AIやOCR（光学文字認識）技術を組み合わせることで、これらの課題を一気に解決できます。
