    - heading "1. なぜ経理業務のAI自動化が注目されているのか" [level=2] [ref=e57]
    - paragraph [ref=e58]: 経理業務には「定型的・繰り返し・ルールベース」の作業が多く含まれます。これはまさにAIが得意とする領域です。
    - heading "経理業務が抱える3つの課題" [level=3] [ref=e59]
