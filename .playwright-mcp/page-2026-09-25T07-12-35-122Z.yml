    - heading "2. AIで自動化できる経理業務にはどんなものがありますか？" [level=2] [ref=e83]
    - paragraph [ref=e84]: 具体的に、どんな経理業務をAIで自動化できるのか。実践的な5つの活用例をご紹介します。
    - heading "1. 請求書の自動読み取り・データ化" [level=3] [ref=e85]
    - paragraph [ref=e86]: 紙やPDFの請求書をAI-OCRで自動読み取り。取引先名、金額、日付、品目などを自動でデータ化します。
    - paragraph [ref=e87]:
      - strong [ref=e88]: 従来
      - text: ": 請求書を1枚ずつ目視確認 → 手入力（1枚あたり3〜5分）"
      - strong [ref=e89]: AI導入後
      - text: ": スキャンするだけで自動データ化（1枚あたり10秒）"
    - paragraph [ref=e90]:
      - text: 月に100枚の請求書を処理する企業なら、
      - strong [ref=e91]: 毎月約5時間の削減
      - text: になります。
    - img "AIによる請求書自動読み取り" [ref=e94]
    - heading "2. 仕訳の自動入力" [level=3] [ref=e95]
    - paragraph [ref=e96]: 過去の仕訳データをAIに学習させることで、新しい取引の勘定科目を自動で判定。会計ソフトへの入力を自動化します。
    - paragraph [ref=e97]: 例えば「Amazon Business からの請求 → 消耗品費」「AWS利用料 → 通信費」といったパターンをAIが記憶し、次回から自動で仕訳します。
    - heading "3. 経費精算の自動化" [level=3] [ref=e98]
    - paragraph [ref=e99]: 従業員が撮影したレシートの写真をAIが読み取り、金額・日付・カテゴリを自動入力。承認フローまで自動化できます。
    - paragraph [ref=e100]: ChatGPTやClaude Codeを活用すれば、「レシート画像をアップロード → 経費精算書を自動生成」という仕組みも構築可能です。
    - heading "4. 入金消込の自動化" [level=3] [ref=e101]
    - paragraph [ref=e102]: 銀行口座の入金データと請求書データをAIが自動照合。入金消込作業を自動化し、未入金のアラート通知も設定できます。
    - paragraph [ref=e103]: これにより「入金確認漏れ」や「督促の遅れ」を防止できます。
    - heading "5. 月次レポートの自動生成" [level=3] [ref=e104]
    - paragraph [ref=e105]:
      - text: 会計データから月次の損益計算書、キャッシュフローレポート、部門別売上分析などを自動生成。経営判断に必要なデータを、毎月自動で可視化します。集計したデータは、
      - link "価格改定の根拠を整理する" [ref=e106] [cursor=pointer]:
        - /url: claude-code-price-revision-preparation
      - text: 際の材料としても活用できます。
    - generic [ref=e107]:
      - heading "実績紹介" [level=4] [ref=e108]
