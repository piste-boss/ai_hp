    - heading "4. 導入前に知っておきたい注意点" [level=2] [ref=e174]
    - heading "データのセキュリティ" [level=3] [ref=e175]
    - paragraph [ref=e176]: 経理データには機密情報が含まれます。AIツールを選ぶ際は、データの保管場所、暗号化の有無、アクセス権限の設定などを必ず確認しましょう。
    - heading "税理士との連携" [level=3] [ref=e177]
    - paragraph [ref=e178]: AI自動化はあくまで「入力・処理の効率化」です。最終的な確認や税務判断は、税理士の専門知識が必要です。AIと税理士の役割分担を明確にしておきましょう。
    - heading "段階的な導入" [level=3] [ref=e179]
    - paragraph [ref=e180]: 「すべてを一度にAI化」は失敗のもとです。まず1つの業務から始めて、効果を確認してから範囲を広げるのが成功のコツです。
    - heading "5. よくある質問" [level=2] [ref=e181]
    - generic [ref=e182]:
      - paragraph [ref=e183]: Q.会計の知識がなくてもAI自動化は導入できますか？
      - paragraph [ref=e184]: A.はい、可能です。freeeやマネーフォワードなどのクラウド会計ソフトは、会計知識がなくても使えるように設計されています。AIがさらにその操作を簡単にしてくれます。ただし、初期設定には専門家のサポートがあると安心です。
    - generic [ref=e185]:
      - paragraph [ref=e186]: Q.既存の会計ソフトからの乗り換えは大変ですか？
      - paragraph [ref=e187]: A.多くのクラウド会計ソフトは、既存データのインポート機能を備えています。過去データの移行は1〜2週間程度で完了するのが一般的です。
    - generic [ref=e188]:
      - paragraph [ref=e189]: Q.セキュリティは本当に大丈夫ですか？
      - paragraph [ref=e190]: A.クラウド会計ソフトやAIサービスのデータの送信先・保存条件・アクセス権限を確認してください。Claude Codeは手元のPCで操作しますが、推論時にはプロンプトや必要なコンテキストをモデル提供者へ送信します。機密データは匿名化し、組織の利用ルールに従ってください。
    - generic [ref=e191]:
      - paragraph [ref=e192]: Q.AIが間違った仕訳をしたらどうなりますか？
      - paragraph [ref=e193]: A.AIの判定には誤りが含まれるため、仕訳の確定前に担当者が確認します。利用するだけで継続学習したり、一定期間で特定の精度に達したりするとは限りません。自社データで正確性を検証し、判断ルールと確認手順を改善してください。
    - paragraph [ref=e194]:
      - text: 参考：
      - link "Claude Code公式のデータ取り扱い" [ref=e195] [cursor=pointer]:
