    - generic [ref=e22]:
      - paragraph [ref=e23]: この記事でわかること
      - list [ref=e24]:
        - listitem [ref=e25]: 外注先の実績が「記憶頼み」になる3つの理由
        - listitem [ref=e26]: 機械に任せる範囲と、人が決める範囲
        - listitem [ref=e27]: 実務5ステップ
    - paragraph [ref=e28]:
      - text: 「あの業者さん、前は納期どおりだったっけ」「この職人さんに頼んだのは去年だったか、一昨年だったか」。中小企業が外注先や協力会社を選ぶとき、判断のもとになるのはたいてい担当者の記憶です。頼んだ回数、かかった金額、納期を守ってくれたか、仕上がりに手直しがあったか。どれも取引のたびに起きているのに、
      - strong [ref=e29]: 終わった案件の中に散らばったまま、誰も並べて見たことがありません
      - text: 。
    - paragraph [ref=e30]:
      - text: その結果、何が起きるか。急ぎの仕事で「いつもの所」に頼み、いつもの所が実は三回に一回は遅れていることに気づかない。逆に、一度だけ小さな不備があった先を、それきり避けてしまう。新しい担当者は前任者の「あそこは大丈夫」という言葉だけを頼りに発注する。
      - strong [ref=e31]: 外注先の記録がないことの本当の損失は、頼む先を選ぶたびに、毎回ゼロから勘で決めていること
      - text: です。
    - paragraph [ref=e32]:
      - text: この記事では、Anthropic社の公式AIコーディングツール
      - strong [ref=e33]: Claude Code
      - text: を使って、過去の依頼を外注先ごとに一覧にそろえ、納期・金額・仕上がりの実績を数えて、次に誰へ頼むかを根拠をもって決められる状態にするまでの手順を、非エンジニアの方向けに整理します。どこへ頼むか、取引を続けるか、単価の相談をするかは人の判断。機械に任せるのは、
      - strong [ref=e34]: 散らばった依頼の記録を集めて、外注先ごとにそろえて、数える作業
      - text: です。
