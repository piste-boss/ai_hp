    - heading "外注先の実績が「記憶頼み」になる3つの理由" [level=2] [ref=e54]
    - img "外注先の実績が「記憶頼み」になる3つの理由" [ref=e56]
    - paragraph [ref=e57]: 記録が残らないのは、担当者の怠慢ではありません。残らない構造が、仕事の側にあります。
    - heading "1. 依頼の記録が「案件」の中に閉じている" [level=3] [ref=e58]
    - paragraph [ref=e59]:
      - text: 見積書、発注書、納品の受け取り、請求書の支払い。外注に関する記録は、すべて案件ごとの書類の中にあります。案件が終われば、その案件の書類ごと片づきます。
      - strong [ref=e60]: 外注先という切り口で横に並べる場所が、最初から存在しません
      - text: 。
    - heading "2. 良かったことも、困ったことも、その場で終わる" [level=3] [ref=e61]
    - paragraph [ref=e62]:
      - text: 納期に一日遅れた。仕上がりに小さな手直しがあった。逆に、急ぎに応えてくれた。こうした出来事は、その場のひと声、やり取りの文面一つで片づき、書き残されません。
      - strong [ref=e63]: 次に頼むときに思い出せるのは、いちばん最近の一回か、いちばん印象の強かった一回だけ
      - text: です。
    - heading "3. 評価の言葉が人によって違う" [level=3] [ref=e64]
    - paragraph [ref=e65]:
      - text: 「あそこは早い」「あそこは丁寧」「あそこは高い」。同じ外注先でも、頼んだ人が違えば評価が変わります。基準がそろっていないので、
      - strong [ref=e66]: 担当者が替わると評価も一緒に消えます
      - text: 。
    - blockquote [ref=e67]: 外注先の実績が残らないのは、記録が案件単位に閉じ、出来事がその場で終わり、評価の基準がないからです。この三つは、いずれも機械に任せて軽くできる種類の問題です。
    - heading "機械に任せる範囲と、人が決める範囲" [level=2] [ref=e68]
    - paragraph [ref=e69]:
      - text: 大前提として、
      - strong [ref=e70]: どの外注先に頼むか、取引を続けるか、単価や条件を相談するかは経営の判断
      - text: であり、人が決めることです。機械に任せるのは、過去の依頼を集めて外注先ごとに一覧にそろえ、納期・金額・仕上がりの実績を数え、比べられる形に並べるところまでです。
