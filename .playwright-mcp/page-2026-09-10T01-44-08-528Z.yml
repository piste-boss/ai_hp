    - paragraph [ref=e112]:
      - text: 線引きはこれまでの記事と同じです。
      - strong [ref=e113]: 集めて、そろえて、数えるのが機械。決めて、伝えるのが人
      - text: 。この順番を守ると、「あそこは大丈夫だったはず」が「過去十二回のうち遅れは二回、平均一日、手直しは一回」という言葉に変わります。
    - heading "実務5ステップ" [level=2] [ref=e114]
    - img "実務5ステップ" [ref=e116]
    - heading "ステップ1：過去一年分の外注を掘り起こす" [level=3] [ref=e117]
    - paragraph [ref=e118]:
      - text: まず、過去一年に外注した案件を集めます。見積書、発注書、納品書、請求書、支払いの記録、そしてやり取りの文面。形はばらばらで構いません。Claude Code には「これらの資料から、外部に依頼した仕事を見つけて、外注先名・依頼日・案件名・依頼内容・金額・約束の納期・実際の納品日を一覧にしてください。わからない項目は空欄にし、どの資料から拾ったかを添えてください」と頼みます。
      - strong [ref=e119]: 最初の一覧は穴だらけで正常
      - text: です。特に「実際の納品日」の空欄が多いはずで、それがこれまで納期の実績を見ていなかった証拠になります。
    - heading "ステップ2：外注先の名前と仕事の種類をそろえる" [level=3] [ref=e120]
    - paragraph [ref=e121]:
      - text: 一覧ができたら、外注先名の欄を見ます。「株式会社〇〇」「〇〇さん」「〇〇工業」と、同じ相手が別の名前で並んでいるはずです。Claude Code に「外注先名の表記ゆれをまとめて一つの名前にそろえ、対応表を出してください。あわせて、依頼内容を『加工』『施工』『デザイン』『配送』のように十個以内の種類に分けてください」と頼みます。
      - strong [ref=e122]: 種類を分けておくことが、あとで比べるときの要
      - text: です。加工を頼んだ先と配送を頼んだ先を同じ表で比べても意味がありません。
    - heading "ステップ3：納期・金額・手直しの三つを数える" [level=3] [ref=e123]
    - paragraph [ref=e124]:
      - text: そろった一覧から、外注先ごとの実績を出します。Claude Code に「外注先ごとに、依頼回数・合計金額・一件あたりの平均額・約束の納期に対する遅れの回数と平均日数・手直しや再納品があった回数を数えてください。見積額と請求額に差があった件も数えてください」と頼みます。
      - strong [ref=e125]: 数えるのは、納期・金額・手直しの三つで十分
      - text: です。この三つが並ぶだけで、「早いが高い」「安いが手直しが多い」「遅れるが仕上がりは確か」といった外注先ごとの性格が、初めて言葉になります。
    - heading "ステップ4：同じ種類の仕事で外注先を並べる" [level=3] [ref=e126]
    - paragraph [ref=e127]:
      - text: ここが一覧をつくる目的です。Claude Code に「仕事の種類ごとに、頼んだことのある外注先を並べ、依頼回数・平均額・遅れの割合・手直しの回数を比べられる表にしてください。依頼回数が一回しかない先には印をつけてください」と頼みます。出てきた表を見れば、
      - strong [ref=e128]: 「加工はA社が最安だが遅れが三割、B社は一割高いが遅れゼロ」
      - text: のような事実が見えます。急ぎの仕事はB社、余裕のある仕事はA社、という使い分けを決めるのは人です。一回しか頼んでいない先に印をつけるのは、
      - strong [ref=e129]: 一回の印象で良し悪しを決めないため
      - text: です。
    - heading "ステップ5：新しい依頼は「一言」で足す運用にする" [level=3] [ref=e130]
    - paragraph [ref=e131]:
      - text: 一覧は、更新が止まれば元に戻ります。外注が終わったら、担当者は「〇月〇日、〇〇社、看板の加工、八万円、納期どおり、手直しなし」と一言だけ残し、Claude Code にそれを一覧へ反映させます。
      - strong [ref=e132]: 担当者が表を自分の手で直す運用にしない
      - text: ことが続けるコツです。半年に一度「外注先ごとの実績を、前の半年と比べてください」と頼めば、良くなった先、悪くなった先が数字で返ってきます。
    - heading "頼み方の3原則" [level=2] [ref=e133]
    - paragraph [ref=e134]:
      - strong [ref=e135]: 1. 「遅れ」の基準を先に決めておく
    - paragraph [ref=e136]:
      - text: 約束の納期を一日でも過ぎたら遅れなのか、こちらの都合で納期を動かした場合はどう扱うのか。ここが曖昧だと、遅れの回数の意味が人によって変わります。おすすめは、
      - strong [ref=e137]: 約束した納期を過ぎたらすべて記録し、理由の欄に「先方都合」「当社都合」「天候など」を分けて書く
      - text: ことです。当社都合で遅れた分を外注先の実績に数えないように、集計のときに除けます。
    - paragraph [ref=e138]:
      - strong [ref=e139]: 2. 評価は「起きたこと」で書き、「印象」で書かない
    - paragraph [ref=e140]:
      - text: 「対応が良い」「感じが悪い」と書くと、記録が人の好みになり、担当者が替わると意味を失います。書くのは「急ぎの依頼に翌日で応えた」「寸法違いで再納品になった」のように、
      - strong [ref=e141]: 起きた事実
      - text: です。印象は、事実が並べば自然と読み取れます。
    - paragraph [ref=e142]:
      - strong [ref=e143]: 3. 件数と金額を突き合わせる
    - paragraph [ref=e144]:
      - text: 一覧の依頼回数と、会計の外注費の支払い件数を突き合わせます。合わなければ、一覧に拾えていない依頼があります。
      - strong [ref=e145]: 拾えていない依頼が多い外注先ほど、実は頻繁に頼んでいる相手
      - text: である場合が少なくありません。
    - heading "つまずきやすい5つの型" [level=2] [ref=e146]
    - heading "1. 最初から点数をつけようとする" [level=3] [ref=e147]
    - paragraph [ref=e148]: 五段階評価の欄をつくり、誰も埋めなくなる型です。点数は要りません。納期・金額・手直しの三つの事実が並べば、点数をつけなくても比べられます。
    - heading "2. 一回の出来事で決めてしまう" [level=3] [ref=e149]
    - paragraph [ref=e150]:
      - text: 一度の遅れで取引をやめる、一度の急ぎ対応で最優先にする型です。ステップ4で「一回しか頼んでいない先」に印をつけるのは、この型を避けるためです。
      - strong [ref=e151]: 三回以上の実績が並ぶまでは、傾向ではなく出来事として扱います
      - text: 。
    - heading "3. 安さだけで並べる" [level=3] [ref=e152]
    - paragraph [ref=e153]: 金額の列だけを見て、最安の先に集中する型です。遅れと手直しの回数を金額に換算すると、最安の先が最も高くついていることがあります。三つの列を必ず一緒に見ます。
    - heading "4. 悪い記録を残しにくい" [level=3] [ref=e154]
    - paragraph [ref=e155]:
      - text: 「付き合いが長いので書きにくい」と、遅れや手直しを記録しない型です。記録は相手を責めるためではなく、
      - strong [ref=e156]: 急ぎのときに誰へ頼むかを迷わないため
      - text: のものです。長い付き合いの先ほど、実績が残っているほうが、条件の相談もしやすくなります。
    - heading "5. 一覧をつくって、頼む先を変えない" [level=3] [ref=e157]
    - paragraph [ref=e158]:
      - text: 表ができ、傾向が見えたところで止まる型です。半年に一度、
      - strong [ref=e159]: 仕事の種類ごとに「次の半年、最初に声をかける先」を一つ決める
      - text: ルールにします。決めた先と実績を、次の半年でまた比べます。
    - heading "業種別の効きどころ" [level=2] [ref=e160]
    - paragraph [ref=e161]:
      - strong [ref=e162]: 建設・リフォーム・設備
      - text: — 職種ごとに協力会社が複数ある業種です。職種別に納期と手直しの実績が並ぶと、繁忙期にどこへ先に声をかけるかが決まります。
    - paragraph [ref=e163]:
      - strong [ref=e164]: 製造業・部品加工
      - text: — 加工・表面処理・組立を外に出している場合、外注先ごとの受入不良と納期遅れが、そのまま自社の納期に響きます。実績が並ぶと、二社目を育てる判断の根拠になります。
    - paragraph [ref=e165]:
      - strong [ref=e166]: 制作・デザイン・印刷
      - text: — カメラマン、ライター、印刷会社など、案件ごとに相手が変わりやすい業種です。仕事の種類別の実績があると、新しい担当者でも同じ基準で頼めます。
    - paragraph [ref=e167]:
      - strong [ref=e168]: 飲食・小売
      - text: — 食材・資材の仕入れ先や、内装・機器の修理業者が対象です。修理の呼び出しから到着までの時間を納期として記録すると、緊急時に頼む先が決まります。
    - paragraph [ref=e169]:
      - strong [ref=e170]: 士業・コンサルティング
      - text: — 翻訳・データ入力・資料作成など、部分的に外へ出す仕事があります。金額の実績が並ぶと、内製と外注の線引きに根拠がつきます。
    - heading "よくあるご質問" [level=2] [ref=e171]
    - heading "Q. 外注先は五社ほどです。一覧にするほどでしょうか" [level=3] [ref=e172]
    - paragraph [ref=e173]:
      - text: 五社でも、一年で数十件の依頼があります。数十件を外注先別・仕事の種類別に並べれば、必ず偏りが出ます。
      - strong [ref=e174]: 外注先が少ないうちに記録の形を決めておくと、増えたときに困りません
      - text: 。それに、五社しかないからこそ、一社の遅れが自社の納期にそのまま響きます。
    - heading "Q. 相手に「評価されている」と思われませんか" [level=3] [ref=e175]
    - paragraph [ref=e176]:
      - text: 一覧は社内で使うもので、相手に見せる必要はありません。ただ、事実が並んでいれば、条件の相談をするときに「過去一年で十二回お願いし、急ぎに毎回応えていただいた」と、感謝を数字で伝えることもできます。
      - strong [ref=e177]: 記録は相手を選別する道具ではなく、関係を続けるための材料
      - text: です。
    - heading "Q. 昔の資料が残っていません" [level=3] [ref=e178]
    - paragraph [ref=e179]:
      - text: 残っている範囲で始めて構いません。過去一年が無理なら、直近三か月からで十分です。
      - strong [ref=e180]: 大事なのは今日からの依頼を一言ずつ足すこと
      - text: で、半年もすれば比べられる実績になります。
    - heading "Q. どのくらいの時間がかかりますか" [level=3] [ref=e181]
    - paragraph [ref=e182]:
      - text: 過去一年分の掘り起こしに半日、名前と種類の整理に一時間、以後は依頼が終わるたびに一言残す数十秒と、半年に一度の集計を見る三十分ほどです。
      - strong [ref=e183]: 急ぎの仕事で頼む先を間違えた一件の損失と比べれば、はるかに小さな投資
      - text: です。
    - heading "まとめ" [level=2] [ref=e184]
    - paragraph [ref=e185]: 外注先の実績が記憶頼みになるのは、記録が案件単位に閉じ、出来事がその場で終わり、評価の基準がないからです。裏を返せば、集めて、そろえて、数える作業を機械に任せてしまえば、残るのは「どこへ頼むか」という判断だけになります。
    - paragraph [ref=e186]: 過去一年分を掘り起こす。外注先の名前と仕事の種類をそろえる。納期・金額・手直しの三つを数える。同じ種類の仕事で外注先を並べる。新しい依頼は一言で足す。この順番なら、現場の負担を増やさずに、頼む先を根拠をもって決められるようになります。
    - paragraph [ref=e187]:
      - text: 集めて、そろえて、数えるのは機械。決めて、伝えるのは人。
      - strong [ref=e188]: 「あそこは大丈夫だったはず」が「十二回中、遅れは二回。急ぎはB社」に変わる状態
      - text: が、小さな会社が納期と信用を守る、いちばん確実な方法です。
